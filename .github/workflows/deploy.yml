name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup wrangler.json from example
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('wrangler.example.json', 'utf8'));
          j.name = 'moemail';
          if (j.d1_databases?.[0]) {
            j.d1_databases[0].database_name = process.env.DATABASE_NAME || 'moemail-db';
            j.d1_databases[0].database_id = process.env.DATABASE_ID;
          }
          if (j.kv_namespaces?.[0]) {
            j.kv_namespaces[0].id = process.env.KV_NAMESPACE_ID;
          }
          fs.writeFileSync('wrangler.json', JSON.stringify(j, null, 2));
          console.log('✅ wrangler.json ready');
          NODE

      - name: Write unquoted runtime secrets JSON
        env:
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const strip = (v) => String(v ?? '').trim().replace(/^["']+|["']+$/g, '');
          const env = {
            AUTH_GITHUB_ID: strip(process.env.AUTH_GITHUB_ID),
            AUTH_GITHUB_SECRET: strip(process.env.AUTH_GITHUB_SECRET),
            AUTH_SECRET: strip(process.env.AUTH_SECRET),
            AUTH_TRUST_HOST: 'true',
            AUTH_URL: 'https://moemail-9l7.pages.dev'
          };
          for (const [k, v] of Object.entries(env)) {
            if (!v) throw new Error('Missing secret: ' + k);
          }
          fs.writeFileSync('.env.runtime', JSON.stringify(env, null, 2));
          console.log('✅ secrets prepared', Object.keys(env).join(','));
          console.log('AUTH_GITHUB_ID length', env.AUTH_GITHUB_ID.length, 'starts', env.AUTH_GITHUB_ID.slice(0, 4));
          NODE

      - name: Push secrets to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler pages secret bulk .env.runtime --project-name moemail

      - name: Build and deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy:pages

      - name: Cleanup
        if: always()
        run: rm -f .env.runtime .env wrangler.json
